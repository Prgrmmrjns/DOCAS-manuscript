site_name: ReplayBG
site_description: A digital-twin based framework for the development and assessment of new algorithms for type 1 diabetes management
site_url: https://DIANA-UNIPD.github.io/replaybg/
repo_url: https://github.com/DIANA-UNIPD/replaybg
repo_name: DIANA-UNIPD/replaybg
edit_uri: edit/main/docs/
copyright: Made with ❤️ by Giacomo Cappon

extra:
  generator: false

theme:
  name: material
  custom_dir: overrides
  favicon: assets/images/replay-bg-logo.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            members_order: source
            show_if_no_docstring: true
            show_source: true
            docstring_style: google
            filters:
              - "!^__(?!init)"    # hide dunder except __init__

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Guide:
      - Getting Started: getting_started.md
      - The ReplayBG Object: replaybg_object.md
      - Blueprints:
          - Choosing a Blueprint: blueprints/choosing.md
          - Single Meal: blueprints/single_meal.md
          - Multi Meal: blueprints/multi_meal.md
          - Multi Meal Extended: blueprints/multi_meal_extended.md
          - Custom Blueprint: blueprints/custom.md
      - Choosing Data for Twinning: data_requirements.md
      - The CGM Error Model: cgm_model.md
      - Twinning Procedure: twinning.md
      - Replay: replay.md
      - Saving Results: saving_results.md
      - Plotting Utilities: plotting.md
      - Analyzing Results: analyzing_results.md
      - Migration: migration.md
  - API Reference:
      - ReplayBG: api/replaybg.md
      - Data: api/data.md
      - Model: api/model.md
      - Twinner: api/twinner.md
      - Distributions: api/distributions.md
      - Callbacks: api/callbacks.md
      - Sensors: api/sensors.md
      - Environment: api/environment.md
      - Utils: api/utils.md
