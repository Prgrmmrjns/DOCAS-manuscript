[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docas-manuscript"
version = "0.1.0"
description = "DOCAS manuscript experiments (OhioT1DM / ReplayBG) — private"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "docas>=0.1.0",
  "lightgbm>=4.0",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "polars>=0.20",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "joblib>=1.3",
  "numba>=0.59",
  "tqdm>=4.66",
  "pyarrow>=14",
  "numpy>=1.26",
]

[project.optional-dependencies]
lstm = ["tensorflow>=2.16,<2.17"]

[tool.setuptools]
packages = []
