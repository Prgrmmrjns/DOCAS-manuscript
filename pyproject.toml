[project]
name = "docas-manuscript"
version = "1.0.0"
description = "Reproduction code for 'Insulin Dose-Response Alignment for Glucose Forecasting in Type 1 Diabetes' (DOCAS)"
requires-python = ">=3.14"
dependencies = [
    "py-replay-bg",
    "catboost>=1.2",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "polars>=0.20",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "joblib>=1.3",
    "numpy>=1.26",
    "torch>=2.0",
    "optuna>=5.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
# ReplayBG 2.x at the exact commit used for the paper.
py-replay-bg = { git = "https://github.com/DIANA-UNIPD/replaybg", rev = "c2943f3ccb91dfc70a491bcdd5753bf2f78cee64" }
