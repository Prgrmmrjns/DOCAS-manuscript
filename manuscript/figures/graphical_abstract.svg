<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DOCAS graphical abstract</title>
  <desc id="desc">Observational diabetes data can produce confounded insulin effects. DOCAS adds synthetic physiologically aligned dose-response samples, reducing alignment error and improving ReplayBG outcomes.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12355b"/>
      <stop offset=".5" stop-color="#5b3fa3"/>
      <stop offset="1" stop-color="#007f9e"/>
    </linearGradient>
    <linearGradient id="purpleSoft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1ebff"/>
      <stop offset="1" stop-color="#e4f7fb"/>
    </linearGradient>
    <linearGradient id="greenSoft" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ebf8ef"/>
      <stop offset="1" stop-color="#d6f0df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/>
    </filter>
    <marker id="arrowNavy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#163d67"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6b46c1"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#169b62"/>
    </marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}
      .title{font:700 34px Inter,Arial,sans-serif;fill:#fff}
      .subtitle{font:500 18px Inter,Arial,sans-serif;fill:#e9f5ff}
      .panelTitle{font:700 23px Inter,Arial,sans-serif;fill:#fff;letter-spacing:.5px}
      .h2{font:700 21px Inter,Arial,sans-serif;fill:#12355b}
      .body{font:500 16px Inter,Arial,sans-serif;fill:#29465f}
      .small{font:500 14px Inter,Arial,sans-serif;fill:#47647c}
      .tiny{font:600 12px Inter,Arial,sans-serif;fill:#47647c}
      .metric{font:800 27px Inter,Arial,sans-serif}
      .label{font:700 15px Inter,Arial,sans-serif}
      .white{fill:#fff}
      .axis{stroke:#7890a4;stroke-width:1.5}
      .grid{stroke:#d9e4ec;stroke-width:1}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7fafc"/>
  <rect x="24" y="20" width="1552" height="104" rx="22" fill="url(#header)" filter="url(#shadow)"/>
  <text x="800" y="62" text-anchor="middle" class="title">Dose-Response Curve Alignment via Synthetic Data</text>
  <text x="800" y="94" text-anchor="middle" class="subtitle">Physiologically conformant glucose forecasting in type 1 diabetes</text>

  <!-- LEFT: observational data -->
  <g filter="url(#shadow)">
    <rect x="30" y="150" width="445" height="660" rx="22" fill="#fff" stroke="#156f99" stroke-width="2"/>
    <path d="M52 150 H453 Q475 150 475 172 V211 H30 V172 Q30 150 52 150Z" fill="#087ca7"/>
  </g>
  <text x="252" y="188" text-anchor="middle" class="panelTitle">1 | OBSERVATIONAL DATA</text>

  <!-- CGM sensor icon and trace -->
  <circle cx="91" cy="272" r="38" fill="#eef6fb" stroke="#1683b0" stroke-width="4"/>
  <circle cx="91" cy="272" r="12" fill="#fff" stroke="#1683b0" stroke-width="3"/>
  <path d="M137 255 q18 17 0 34 M147 245 q29 27 0 54" fill="none" stroke="#38a7d2" stroke-width="4" stroke-linecap="round"/>
  <text x="54" y="330" class="label sans" fill="#087ca7">CGM sensor</text>
  <rect x="188" y="233" width="240" height="91" rx="12" fill="#f6fbfe" stroke="#c8e4ef"/>
  <path d="M200 298 C220 292 229 258 249 268 S277 303 294 285 S316 247 337 260 S363 306 382 279 S408 262 419 270" fill="none" stroke="#1683b0" stroke-width="5"/>
  <line x1="200" y1="281" x2="419" y2="281" stroke="#f2a541" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- insulin syringe icon -->
  <g transform="translate(50 374) rotate(-32 57 22)">
    <rect x="16" y="10" width="89" height="24" rx="7" fill="#2f6da1" stroke="#12355b" stroke-width="3"/>
    <rect x="2" y="15" width="17" height="14" rx="2" fill="#dcecf6" stroke="#12355b" stroke-width="3"/>
    <line x1="105" y1="22" x2="138" y2="22" stroke="#12355b" stroke-width="3"/>
    <line x1="138" y1="22" x2="151" y2="17" stroke="#12355b" stroke-width="2"/>
    <line x1="42" y1="12" x2="42" y2="32" stroke="#fff" stroke-width="2"/>
    <line x1="57" y1="12" x2="57" y2="32" stroke="#fff" stroke-width="2"/>
  </g>
  <path d="M159 408 C159 397 169 386 169 386 C169 386 179 397 179 408 A10 10 0 0 1 159 408Z" fill="#42b7d8"/>
  <text x="54" y="449" class="label sans" fill="#245b88">Insulin</text>

  <!-- meal icon -->
  <ellipse cx="329" cy="397" rx="70" ry="39" fill="#edf4f7" stroke="#71889a" stroke-width="3"/>
  <ellipse cx="329" cy="397" rx="57" ry="29" fill="#fff"/>
  <path d="M290 392 q13-24 28 0 q-5 24-14 25 q-9-1-14-25Z" fill="#f5a340"/>
  <circle cx="339" cy="389" r="13" fill="#e85d4a"/>
  <circle cx="361" cy="402" r="14" fill="#63ad5b"/>
  <path d="M339 376 q6-10 12-4" fill="none" stroke="#3c8650" stroke-width="3"/>
  <text x="267" y="449" class="label sans" fill="#c36b19">Meal / CHO</text>

  <!-- confounding triangle -->
  <rect x="54" y="482" width="397" height="260" rx="18" fill="#fff8f6" stroke="#f1c2b7" stroke-width="2"/>
  <text x="252" y="514" text-anchor="middle" class="h2">Indication bias</text>
  <g>
    <rect x="174" y="532" width="156" height="58" rx="13" fill="#fff" stroke="#e65f4c" stroke-width="2"/>
    <path d="M195 566 C195 550 208 539 208 539 C208 539 221 550 221 566 A13 13 0 0 1 195 566Z" fill="#e65f4c"/>
    <text x="237" y="558" class="label sans" fill="#aa3026">High glucose</text>
    <text x="237" y="577" class="small sans">triggers treatment</text>
    <rect x="70" y="652" width="132" height="54" rx="12" fill="#fff" stroke="#f2a541" stroke-width="2"/>
    <text x="136" y="684" text-anchor="middle" class="label sans" fill="#b76810">Meals</text>
    <rect x="300" y="652" width="132" height="54" rx="12" fill="#fff" stroke="#2878b5" stroke-width="2"/>
    <text x="366" y="684" text-anchor="middle" class="label sans" fill="#245b88">Insulin dose</text>
    <path d="M142 651 C150 620 177 594 205 586" fill="none" stroke="#e65f4c" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrowNavy)"/>
    <path d="M362 651 C354 620 327 594 299 586" fill="none" stroke="#e65f4c" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrowNavy)"/>
    <path d="M204 680 H294" fill="none" stroke="#e65f4c" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrowNavy)"/>
  </g>
  <text x="252" y="774" text-anchor="middle" class="body">Accurate forecasts can learn the wrong insulin effect</text>

  <!-- process arrow 1 -->
  <path d="M491 478 H551" stroke="#163d67" stroke-width="12" stroke-linecap="round" marker-end="url(#arrowNavy)"/>

  <!-- CENTER: DOCAS -->
  <g filter="url(#shadow)">
    <rect x="575" y="150" width="450" height="660" rx="22" fill="#fff" stroke="#6b46c1" stroke-width="2"/>
    <path d="M597 150 H1003 Q1025 150 1025 172 V211 H575 V172 Q575 150 597 150Z" fill="#6b46c1"/>
  </g>
  <text x="800" y="188" text-anchor="middle" class="panelTitle">2 | DOCAS ALIGNMENT</text>

  <!-- black box model -->
  <text x="800" y="245" text-anchor="middle" class="h2">Probe any trained model</text>
  <g transform="translate(704 264)">
    <rect x="0" y="0" width="192" height="82" rx="15" fill="#17324d"/>
    <circle cx="38" cy="41" r="17" fill="none" stroke="#66d0df" stroke-width="3"/>
    <circle cx="96" cy="24" r="10" fill="#a98ce0"/>
    <circle cx="96" cy="59" r="10" fill="#a98ce0"/>
    <circle cx="151" cy="41" r="17" fill="none" stroke="#66d0df" stroke-width="3"/>
    <path d="M55 36 L86 25 M55 46 L86 57 M106 25 L135 37 M106 58 L135 45" stroke="#d9edfa" stroke-width="3"/>
  </g>
  <text x="800" y="370" text-anchor="middle" class="small">LightGBM | LSTM | other black-box models</text>

  <!-- paired curves -->
  <rect x="602" y="396" width="396" height="220" rx="18" fill="url(#purpleSoft)" stroke="#c7b7eb"/>
  <text x="800" y="426" text-anchor="middle" class="h2">Align the queried dose-response</text>
  <g transform="translate(626 448)">
    <text x="73" y="14" text-anchor="middle" class="label sans" fill="#d04e3e">Model-implied</text>
    <line x1="14" y1="142" x2="145" y2="142" class="axis"/>
    <line x1="14" y1="142" x2="14" y2="30" class="axis"/>
    <path d="M17 78 C42 70 55 90 76 81 S109 68 141 73" fill="none" stroke="#d04e3e" stroke-width="5"/>
    <text x="79" y="165" text-anchor="middle" class="tiny">insulin dose -&gt;</text>
    <text x="-77" y="7" transform="rotate(-90)" text-anchor="middle" class="tiny">future CGM</text>
  </g>
  <path d="M773 525 H824" stroke="#6b46c1" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowPurple)"/>
  <g transform="translate(837 448)">
    <text x="73" y="14" text-anchor="middle" class="label sans" fill="#169b62">Physiological target</text>
    <line x1="14" y1="142" x2="145" y2="142" class="axis"/>
    <line x1="14" y1="142" x2="14" y2="30" class="axis"/>
    <path d="M17 43 C40 48 56 64 76 86 S110 121 141 130" fill="none" stroke="#169b62" stroke-width="5"/>
    <circle cx="17" cy="43" r="5" fill="#6b46c1"/>
    <circle cx="45" cy="56" r="5" fill="#6b46c1"/>
    <circle cx="74" cy="84" r="5" fill="#6b46c1"/>
    <circle cx="103" cy="113" r="5" fill="#6b46c1"/>
    <circle cx="141" cy="130" r="5" fill="#6b46c1"/>
    <text x="79" y="165" text-anchor="middle" class="tiny">insulin dose -&gt;</text>
    <text x="-77" y="7" transform="rotate(-90)" text-anchor="middle" class="tiny">future CGM</text>
  </g>

  <!-- synthetic augmentation icon -->
  <g transform="translate(614 646)">
    <rect x="0" y="0" width="105" height="94" rx="12" fill="#eaf5fb" stroke="#3299c2" stroke-width="2"/>
    <ellipse cx="52" cy="22" rx="34" ry="12" fill="#fff" stroke="#3299c2" stroke-width="2"/>
    <path d="M18 22 V68 C18 84 86 84 86 68 V22" fill="none" stroke="#3299c2" stroke-width="2"/>
    <path d="M18 43 C18 59 86 59 86 43 M18 62 C18 78 86 78 86 62" fill="none" stroke="#3299c2" stroke-width="2"/>
    <text x="52" y="116" text-anchor="middle" class="tiny">REAL DATA</text>
    <text x="156" y="52" text-anchor="middle" class="metric sans" fill="#6b46c1">+</text>
    <rect x="202" y="0" width="105" height="94" rx="12" fill="#f2ebff" stroke="#6b46c1" stroke-width="2"/>
    <circle cx="226" cy="61" r="7" fill="#6b46c1"/><circle cx="248" cy="51" r="7" fill="#835fd0"/>
    <circle cx="270" cy="36" r="7" fill="#9d7dde"/><circle cx="292" cy="23" r="7" fill="#b09ae1"/>
    <path d="M218 20 C241 29 260 48 298 70" fill="none" stroke="#169b62" stroke-width="4"/>
    <text x="254" y="116" text-anchor="middle" class="tiny">SYNTHETIC ROWS</text>
  </g>
  <rect x="622" y="776" width="356" height="48" rx="24" fill="#6b46c1"/>
  <text x="800" y="806" text-anchor="middle" class="label sans white">Train with an RMSE guardrail</text>

  <!-- process arrow 2 -->
  <path d="M1041 478 H1101" stroke="#6b46c1" stroke-width="12" stroke-linecap="round" marker-end="url(#arrowPurple)"/>

  <!-- RIGHT: outcomes -->
  <g filter="url(#shadow)">
    <rect x="1125" y="150" width="445" height="660" rx="22" fill="#fff" stroke="#169b62" stroke-width="2"/>
    <path d="M1147 150 H1548 Q1570 150 1570 172 V211 H1125 V172 Q1125 150 1147 150Z" fill="#169b62"/>
  </g>
  <text x="1347" y="188" text-anchor="middle" class="panelTitle">3 | SAFER COUNTERFACTUALS</text>

  <!-- cohort people -->
  <text x="1347" y="246" text-anchor="middle" class="h2">OhioT1DM cohort | n = 12</text>
  <g fill="#2d83b8">
    <g transform="translate(1174 268)"><circle cx="12" cy="9" r="9"/><path d="M2 23 q10-9 20 0 v37 h-7V39h-6v21H2Z"/></g>
    <g transform="translate(1207 268)"><circle cx="12" cy="9" r="9"/><path d="M2 23 q10-9 20 0 v37 h-7V39h-6v21H2Z"/></g>
    <g transform="translate(1240 268)"><circle cx="12" cy="9" r="9"/><path d="M2 23 q10-9 20 0 v37 h-7V39h-6v21H2Z"/></g>
    <g transform="translate(1273 268)"><circle cx="12" cy="9" r="9"/><path d="M2 23 q10-9 20 0 v37 h-7V39h-6v21H2Z"/></g>
    <g transform="translate(1306 268)"><circle cx="12" cy="9" r="9"/><path d="M2 23 q10-9 20 0 v37 h-7V39h-6v21H2Z"/></g>
    <g transform="translate(1339 268)"><circle cx="12" cy="9" r="9"/><path d="M2 23 q10-9 20 0 v37 h-7V39h-6v21H2Z"/></g>
    <g transform="translate(1372 268)"><circle cx="12" cy="9" r="9"/><path d="M2 23 q10-9 20 0 v37 h-7V39h-6v21H2Z"/></g>
    <g transform="translate(1405 268)"><circle cx="12" cy="9" r="9"/><path d="M2 23 q10-9 20 0 v37 h-7V39h-6v21H2Z"/></g>
    <g transform="translate(1438 268)"><circle cx="12" cy="9" r="9"/><path d="M2 23 q10-9 20 0 v37 h-7V39h-6v21H2Z"/></g>
    <g transform="translate(1471 268)"><circle cx="12" cy="9" r="9"/><path d="M2 23 q10-9 20 0 v37 h-7V39h-6v21H2Z"/></g>
    <g transform="translate(1504 268)"><circle cx="12" cy="9" r="9"/><path d="M2 23 q10-9 20 0 v37 h-7V39h-6v21H2Z"/></g>
    <g transform="translate(1537 268)"><circle cx="12" cy="9" r="9"/><path d="M2 23 q10-9 20 0 v37 h-7V39h-6v21H2Z"/></g>
  </g>

  <!-- metric cards -->
  <rect x="1152" y="353" width="185" height="143" rx="16" fill="#f3f0fb" stroke="#c9b9e9"/>
  <text x="1244" y="382" text-anchor="middle" class="label sans" fill="#5b3fa3">PH30 ALIGNMENT ERROR</text>
  <rect x="1184" y="413" width="30" height="51" rx="5" fill="#e65f4c"/>
  <rect x="1269" y="454" width="30" height="10" rx="5" fill="#169b62"/>
  <path d="M1219 421 C1240 421 1250 444 1263 453" fill="none" stroke="#6b46c1" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <text x="1199" y="486" text-anchor="middle" class="tiny">0.08</text>
  <text x="1284" y="486" text-anchor="middle" class="tiny">0.01</text>
  <text x="1244" y="408" text-anchor="middle" class="metric sans" fill="#169b62">8x lower</text>

  <rect x="1357" y="353" width="185" height="143" rx="16" fill="#eef7fb" stroke="#b7dce9"/>
  <text x="1449" y="382" text-anchor="middle" class="label sans" fill="#087ca7">PH30 LGBM RMSE</text>
  <text x="1449" y="423" text-anchor="middle" class="metric sans" fill="#245b88">22.5 -&gt; 23.9</text>
  <text x="1449" y="451" text-anchor="middle" class="body">mg/dL</text>
  <text x="1449" y="481" text-anchor="middle" class="label sans" fill="#c36b19">modest trade-off</text>

  <!-- ReplayBG -->
  <rect x="1152" y="521" width="390" height="203" rx="18" fill="url(#greenSoft)" stroke="#9bd4b5"/>
  <text x="1347" y="551" text-anchor="middle" class="h2">ReplayBG digital twin | patient 588</text>
  <rect x="1173" y="576" width="211" height="98" rx="10" fill="#fff" stroke="#bcdccc"/>
  <rect x="1184" y="609" width="189" height="35" fill="#dff3e6"/>
  <line x1="1184" y1="609" x2="1373" y2="609" stroke="#63ad78" stroke-dasharray="5 4"/>
  <line x1="1184" y1="644" x2="1373" y2="644" stroke="#63ad78" stroke-dasharray="5 4"/>
  <path d="M1187 588 C1210 592 1215 622 1232 617 S1254 641 1272 628 S1297 648 1313 632 S1340 647 1368 626" fill="none" stroke="#169b62" stroke-width="4"/>
  <text x="1278" y="696" text-anchor="middle" class="label sans" fill="#137849">TIR 81.7%</text>
  <!-- shield icon -->
  <path d="M1425 578 L1490 598 V638 C1490 674 1460 699 1425 713 C1390 699 1360 674 1360 638 V598Z" fill="#169b62" opacity=".16" stroke="#169b62" stroke-width="4"/>
  <path d="M1392 640 l20 20 42-47" fill="none" stroke="#169b62" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1425" y="690" text-anchor="middle" class="label sans" fill="#137849">TBR 0%</text>

  <rect x="1152" y="747" width="390" height="77" rx="18" fill="#12355b"/>
  <text x="1347" y="778" text-anchor="middle" class="label sans" fill="#8ce4b5">MODEL-AGNOSTIC POST-TRAINING</text>
  <text x="1347" y="806" text-anchor="middle" class="small sans white">Aligned decisions without custom architecture</text>

  <!-- bottom takeaway -->
  <rect x="30" y="847" width="1540" height="37" rx="18" fill="#e8f1f6"/>
  <text x="800" y="872" text-anchor="middle" class="label sans" fill="#12355b">Prediction accuracy alone is insufficient: validate the counterfactual behavior used for treatment decisions.</text>
</svg>
